<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padlock - Sign In</title>
    <meta name="description" content="Sign in to your Padlock account and access your entertainment universe.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./register.css">
    <link rel="stylesheet" href="./signin.css">
</head>

<body>
    <!-- Background Animated Aether Systems -->
    <div class="hero__aether">
        <div class="aura-ball aura-ball--1"></div>
        <div class="aura-ball aura-ball--2"></div>
        <div class="aura-ball aura-ball--3"></div>
    </div>

    <!-- Premium Fixed Navigation Header -->
    <header class="header" id="mainHeader">
        <div class="header__container">
            <div class="header__left">
                <!-- Logo -->
                <a href="./index.html" class="logo">
                    <span class="logo__text">Padlock</span>
                </a>
            </div>

            <!-- Right Controls: Back to Home -->
            <div class="header__right">
                <a href="./index.html" class="btn btn--text">Back to Home</a>
            </div>
        </div>
    </header>

    <!-- Main Sign In Section -->
    <main class="register-container">
        <div class="register-card">
            <div class="register-card__header">
                <h1 class="register-card__title">Welcome Back!</h1>
                <p class="register-card__subtitle">Sign in to manage your watchlists and readlists.</p>
            </div>

            <form class="register-form" id="signinForm">
                <!-- Username or Email Input Group -->
                <div class="input-group">
                    <label for="loginIdentifier" class="input-group__label">Username or Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginIdentifier" name="loginIdentifier" class="input-control" placeholder="Enter username or email" required autocomplete="username">
                    </div>
                </div>

                <!-- Password Input Group -->
                <div class="input-group">
                    <div class="input-group__header">
                        <label for="password" class="input-group__label">Password</label>
                        <a href="#" class="forgot-password-link">Forgot?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <!-- Remember Me Group -->
                <div class="remember-me-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe" class="checkbox-control">
                    <label for="rememberMe" class="checkbox-label">Remember me for 30 days</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-register">Sign In</button>
            </form>

            <div class="register-card__footer">
                <p>Don't have an account? <a href="./register.html" class="login-link">Register</a></p>
            </div>
        </div>
    </main>

    <!-- Footer Area -->
    <footer class="footer">
        <nav class="footer__nav">
            <ul class="footer__list">
                <li><a href="./index.html">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Terms</a></li>
                <li><a href="#">Help</a></li>
                <li><a href="#">© 2025 Padlock</a></li>
            </ul>
        </nav>
    </footer>

    <script src="./script.js" defer></script>
</body>

</html>
